# Local development: the API plus a throwaway Postgres.
# Start:  docker compose up --build
# Stop:   docker compose down        (add -v to also wipe the database)
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: afrigoal
      POSTGRES_PASSWORD: afrigoal
      POSTGRES_DB: afrigoal
    ports:
      - "5433:5432" # localhost:5433 from your Mac (5432 is used by another project)
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afrigoal"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    env_file: .env # LiveScore keys etc.
    environment:
      # Overrides .env: always use the local db container, never production.
      DATABASE_URL: postgresql://afrigoal:afrigoal@db:5432/afrigoal
      FIREBASE_CREDENTIALS_PATH: /run/secrets/service-account.json
    volumes:
      - ./service-account.json:/run/secrets/service-account.json:ro
    ports:
      - "8001:8000" # http://localhost:8001, so it doesn't clash with uvicorn on 8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
